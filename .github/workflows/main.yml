name: GitHub Actions Demo with AI

on:
  push:
    branches: [ "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Run a diagnostic test
        run: echo "Hello World! The workflow is working perfectly."
        
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
  
      - name: Run Copilot Prompt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          copilot -p "Analyze the files in this repository and check for any hardcoded secrets." --allow-all-paths < /dev/null
